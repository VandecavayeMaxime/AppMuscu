name: Build iOS (non signé)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Build iOS (sans signature)
        run: flutter build ios --release --no-codesign

      - name: Empaqueter en .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AppMuscu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AppMuscu-ipa
          path: AppMuscu.ipa
